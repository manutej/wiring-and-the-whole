[package]
name = "wiring-core"
version = "0.1.0"
edition = "2021"
description = "Language-neutral WiringMap v0 validation and graph IR (Phase 1 parity with scripts/validate_wiringmap.py)"
license = "Apache-2.0"

[[bin]]
name = "wiring-validate"
path = "src/bin/wiring_validate.rs"

[[bin]]
name = "wiring-extract-java-refs"
path = "src/bin/wiring_extract_java_refs.rs"

[[bin]]
name = "wiring-reexpand"
path = "src/bin/wiring_reexpand.rs"

[[bin]]
name = "wiring-build-l2-pack"
path = "src/bin/wiring_build_l2_pack.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
