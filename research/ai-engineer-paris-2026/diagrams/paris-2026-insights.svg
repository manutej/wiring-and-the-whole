  <line x1="420" y1="128" x2="420" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="330" y="168" width="180" height="52" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="420" y="190" text-anchor="middle" font-size="10" font-weight="600">Software factories vs orchestras</text>
