  <rect x="360" y="80" width="120" height="48" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="420" y="102" text-anchor="middle" font-size="10" font-weight="600">Process brakes</text>
  <text x="420" y="116" text-anchor="middle" font-size="8" fill="#444">skills · evals · tiers</text>

